[package]
name = "capture"
version = "0.1.0"
edition = "2024"
description = "Spike: detection de la mort dans Valorant par capture d'ecran et correlation de template"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

# Capture d'ecran: Windows seulement. replay/sweep compilent sans.
[target.'cfg(windows)'.dependencies]
ctrlc = "3.5.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
parking_lot = "0.12.5"
windows-capture = "2.0.1"
